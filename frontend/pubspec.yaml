name: textile_erp
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  supabase_flutter: ^2.18.3
  intl: ^0.20.3
  window_manager: 0.5.2
  shadcn_flutter: ^0.0.55
  shared_preferences: ^2.5.6
  desktop_drop: ^0.8.4
  file_picker: ^11.0.3
  fl_chart: ^1.3.0
  image: ^4.12.0
  webview_windows: ^0.2.2
  super_clipboard: ^0.8.4
  url_launcher: ^6.3.3
  http: ^1.2.1
  pdf: ^3.13.1
  printing: ^5.15.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.1

msix_config:
  display_name: Dhaaga
  publisher_display_name: Ambaji Sarees
  publisher: CN=AmbajiSarees, O=AmbajiSarees, L=Surat, S=Gujarat, C=IN
  identity_name: com.ambajisaree.erp
  msix_version: 1.0.0.0
  logo_path: assets/icons/app_icon_source.png
